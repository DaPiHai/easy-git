name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly build with artifacts (TDD §9, m1-plan C-01).
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # TDD §9: linux builds need webkit2gtk-4.1.
  LINUX_APT: >-
    libwebkit2gtk-4.1-dev
    build-essential
    curl
    wget
    file
    libxdo-dev
    libssl-dev
    libayatana-appindicator3-dev
    librsvg2-dev

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install linux system deps
        # generate-bindings compiles the full tauri app crate (webkit2gtk etc.).
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_APT }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: eslint
        run: pnpm lint
      - name: prettier
        run: pnpm format:check
      - name: regenerate bindings and fail on drift
        working-directory: src-tauri
        run: |
          cargo run --bin generate-bindings
          git diff --exit-code -- ../src/lib/ipc/bindings.ts
      - name: typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: install linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_APT }}
      - name: cargo test (workspace)
        working-directory: src-tauri
        run: cargo test --workspace
      - name: vitest
        run: pnpm test

  build:
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_APT }}
      - name: build (all bundles)
        run: pnpm tauri build
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy-git-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.appimage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
